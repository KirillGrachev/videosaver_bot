  quality_menu: "Qualidade"
  stop: "Parar"
  search: "Buscar"
  original: "Original"
  github: "GitHub"
  reload: "Recarregar textos"
  open_link: "Abrir link"
  quality:
    best: "Melhor"
    "1080": "1080p"
    "720": "720p"
    "480": "480p"
    audio: "Áudio (mp3)"
    current_suffix: " (atual)"

