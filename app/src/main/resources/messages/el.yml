# Greek messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*Στείλε μου έναν σύνδεσμο και θα φέρω το αρχείο.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo και πάνω από εκατό ακόμη ιστότοποι: βίντεο, shorts, φωτογραφίες, άλμπουμ, GIF, μουσική."
    - ""
    - "Απλώς επικόλλησε τον σύνδεσμο στη συνομιλία. Δεν χρειάζεται εντολή."
  help:
    command: "*{command}* {description}"
    tip: "Κι το απλούστερο από όλα: στείλε μου έναν σύνδεσμο."
  about:
    - "*Saver Bot*"
    - ""
    - "Ένας πολυπλατφορμικός μεταφορτωτής μέσων: {sources} πηγές στον κατάλογο συν οποιαδήποτε δημόσια σελίδα ως εφεδρική."
    - ""
    - "Έκδοση: {version}"
    - "Σεβάσου τα πνευματικά δικαιώματα και τους κανόνες των ιστότοπων: αποθήκευε μόνο ό,τι επιτρέπεται να αποθηκεύεις."
  settings:
    - "*Ρυθμίσεις*"
    - ""
    - "Ποιότητα: {quality}"
    - "Γλώσσα: {language}"
  quality:
    title: "Διάλεξε την ποιότητα των μεταφορτώσεων. Ισχύει για όλα τα νέα αιτήματα."
    set: "Ποιότητα: *{quality}*. Οι νέες μεταφορτώσεις θα τη χρησιμοποιούν."
  lang:
    choose: "Διάλεξε τη γλώσσα σου:"
    set: "Η γλώσσα άλλαξε."
  sources:
    title: "*Υποστηριζόμενες πηγές: {count}*"
    legend: "[ok] λειτουργεί · [limited] μερικώς (μόνο δημόσιοι σύνδεσμοι, σπάει συχνά) · [login] χρειάζεται λογαριασμό. Κάθε άλλη δημόσια σελίδα δοκιμάζεται με τον γενικό εξωγαγωγέα."
    search:
      prompt: "Γράψε μέρος του ονόματος του ιστότοπου, π.χ. `tiktok` ή `pixiv`. Ένα κενό μήνυμα επιστρέφει τη λίστα."
      empty: "Δεν βρέθηκε τίποτα για «{query}». Ο γενικός εξωγαγωγέας ίσως τα καταφέρει: στείλε απλώς τον σύνδεσμο."
      found: "Βρέθηκαν: {count}. Φύλλισε με τα βέλη ή βελτίωσε το ερώτημα."
  stats:
    - "*Η χρήση σου*"
    - ""
    - "Τελευταία ώρα: {jobs_hour} μεταφορτώσεις"
    - "Σήμερα: {jobs_today} μεταφορτώσεις, {bytes_today}"
  stats.recent: "Πρόσφατα:"
  admin:
    - "*Admin*"
    - ""
    - "Μηχανή: {tools}"
    - "Εργασίες: {active} ενεργές, {queued} σε αναμονή"
    - "Θησαυροφυλάκιο: {vault}"
    - "Χρήστες: {users}"
  reload:
    done: "Τα κείμενα και ο κατάλογος πηγών επαναφορτώθηκαν ({sources} πηγές)."
  flood: "Πάρα πολλά μηνύματα διαδοχικά. Δώσε μου λίγα δευτερόλεπτα."
  warning:
    audio_raw: "Σημείωση: το ffmpeg δεν είναι εγκατεστημένο στον διακομιστή, οπότε ο ήχος παραδόθηκε στο αρχικό του κοντέινερ αντί για mp3."
  pointer:
    dm: "Άνοιξε στην ιδιωτική σου συνομιλία με το bot."
  hint:
    no_url: "Δεν βρήκα σύνδεσμο σε αυτό το μήνυμα. Επικόλλησε ένα URL όπως `https://youtube.com/watch?v=…` και θα φέρω το μέσο."
  prompt:
    url: "Στείλε μου τον σύνδεσμο που θέλεις να αποθηκεύσεις. Ακύρωση με /stop."
  cancel:
    none: "Δεν έχεις ενεργές μεταφορτώσεις για ακύρωση."
    done: "Ακυρωμένες μεταφορτώσεις: {count}."
  status:
    queued: "Αποθηκεύω από *{host}*…"
    files: "Αρχεία που παραδόθηκαν έως τώρα: {count}"
    progress: "Μεταφορτώνω… {percent}%"
    done: "Έτοιμο σε {seconds} δλ · αρχεία: {count} · {size}"
  error:
    not_owner: "Αυτή η εντολή είναι για τον ιδιοκτήτη του bot."
    unknown_command: "Άγνωστη εντολή. Το /help στέλνει τη λίστα."
    invalid_url: "Αυτό δεν μοιάζει με έγκυρο σύνδεσμο http(s)."
    queue_full: "Η ουρά μεταφορτώσεων είναι γεμάτη τώρα. Δοκίμασε σε ένα λεπτό."
    concurrent: "Έχεις ήδη {count} μεταφορτώσεις σε εξέλιξη. Περίμενέ τες ή πάτα Stop."
    quota_hour: "Έφτασε το ωριαίο όριο ({limit} μεταφορτώσεις). Δοκίμασε αργότερα."
    quota_day: "Έφτασε το ημερήσιο όριο ({limit} μεταφορτώσεις). Τα λέμε αύριο."
    quota_bytes: "Έφτασε το ημερήσιο όριο κίνησης ({limit}). Τα λέμε αύριο."
    source_disabled: "Η πηγή «{title}» είναι απενεργοποιημένη σε αυτό το bot από τον διαχειριστή."
    vault_full: "Ο χώρος αποθήκευσης του διακομιστή είναι γεμάτος. Δοκίμασε αργότερα."
    blocked_type: "Το αρχείο «{file}» είναι εκτελέσιμος τύπος ή σενάριο - τέτοια δεν τα παραδίδω."
    too_large: "Το αρχείο είναι πολύ μεγάλο για αυτή την πλατφόρμα: {size} (όριο {cap})."
    too_large_link:
      - "Το αρχείο είναι πολύ μεγάλο για να σταλεί εδώ: {size} (όριο {cap})."
      - ""
      - "Άμεσος σύνδεσμος: {url}"
    cat:
      unsupported: "Αυτός ο σύνδεσμος δεν υποστηρίζεται: κανένας εξωγαγωγέας δεν μπόρεσε να τον πάρει."
      login_required: "Αυτό το περιεχόμενο απαιτεί λογαριασμό στον ιστότοπο. Αποθηκεύω μόνο δημόσιες σελίδες."
      age_restricted: "Περιεχόμενο με ηλικιακό περιορισμό: ο ιστότοπος δεν το δείχνει χωρίς σύνδεση."
      private: "Αυτό το περιεχόμενο είναι ιδιωτικό ή διαγράφηκε από τον δημιουργό."
      not_found: "Η σελίδα ή το μέσο δεν βρέθηκε (404). Έλεγξε τον σύνδεσμο."
      unavailable: "Το μέσο δεν είναι διαθέσιμο: διαγράφηκε ή κρύφτηκε από τον δημιουργό."
      geo_blocked: "Αυτό το περιεχόμενο είναι μπλοκαρισμένο στην περιοχή του διακομιστή."
      live_stream: "Αυτό είναι ζωντανή μετάδοση. Στείλε ξανά τον σύνδεσμο όταν τελειώσει η εκπομπή."
      rate_limited: "Η πηγή περιορίζει το bot αυτή τη στιγμή. Δοκίμασε σε λίγα λεπτά."
      too_large: "Το αρχείο ξεπερνά το όριο και δεν υπάρχει μικρότερη μορφή."
      timeout: "Η μεταφόρτωση ξεπέρασε το χρονικό όριο. Τεράστια ή αργή πηγή; Δοκίμασε ξανά, ίσως με χαμηλότερη ποιότητα."
      tool_missing: "Το εργαλείο εξαγωγής λείπει από τον διακομιστή. Αυτό είναι για τον διαχειριστή."
      network: "Σφάλμα δικτύου κατά την επικοινωνία με την πηγή. Δοκίμασε ξανά."
      cancelled: "Η μεταφόρτωση ακυρώθηκε."
      unknown: "Κάτι πήγε στραβά κατά τη μεταφόρτωση. Δοκίμασε ξανά και αν επαναληφθεί πες το στον διαχειριστή."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} από {total}"
    truncated: "Μόνο τα πρώτα {count} στοιχεία, τα υπόλοιπα είναι στη σελίδα"

button:
  back: "Πίσω"
  settings: "Ρυθμίσεις"
  sources: "Πηγές"
  language: "Γλώσσα"
  about: "Σχετικά"
  help: "Βοήθεια"
  stats: "Τα στατιστικά μου"
  quality_menu: "Ποιότητα"
  stop: "Stop"
  search: "Αναζήτηση"
  original: "Πρωτότυπο"
  github: "GitHub"
  reload: "Επαναφόρτωση κειμένων"
  open_link: "Άνοιγμα συνδέσμου"
  quality:
    best: "Καλύτερη"
    "1080": "1080p"
    "720": "720p"
    "480": "480p"
    audio: "Ήχος (mp3)"
    current_suffix: " (τρέχουσα)"

command:
  desc:
    start: "κύριο μενού"
    help: "τι ξέρω να κάνω"
    save: "μεταφόρτωση μέσω συνδέσμου (ή στείλε απλώς τον σύνδεσμο)"
    stop: "ακύρωση ενεργών μεταφορτώσεων"
    quality: "ποιότητα βίντεο / μόνο ήχος"
    settings: "οι ρυθμίσεις σου"
    sources: "λίστα υποστηριζόμενων ιστότοπων"
