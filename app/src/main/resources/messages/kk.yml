# Kazakh messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*Маған сілтеме жібер, мен файлды әкелемін.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo және тағы жүзден астам сайт: видео, шортс, фотолар, альбомдар, GIF, музыка."
    - ""
    - "Сілтемені жай ғана чатқа қойыңыз. Команда қажет емес."
  help:
    command: "*{command}* {description}"
    tip: "Ең қарапайымы: маған жай сілтеме жіберіңіз."
  about:
    - "*Saver Bot*"
    - ""
    - "Көп платформалы медиа жүктегіш: каталогта {sources} дереккөз, қосымша кез келген жария бет резерв ретінде."
    - ""
    - "Нұсқа: {version}"
    - "Авторлық құқық пен сайттар ережесін құрметтеңіз: тек сақтауға рұқсатыңызды ғана сақтаңыз."
  settings:
    - "*Баптаулар*"
    - ""
    - "Сапа: {quality}"
    - "Тіл: {language}"
  quality:
    title: "Жүктеу сапасын таңдаңыз. Ол барлық жаңа сұрауларға қолданылады."
    set: "Сапа: *{quality}*. Жаңа жүктеулер осыны пайдаланады."
  lang:
    choose: "Тіліңізді таңдаңыз:"
    set: "Тіл ауыстырылды."
  sources:
    title: "*Қолдау көрсетілетін дереккөздер: {count}*"
    legend: "[ok] жұмыс істейді · [limited] ішінара (тек жария сілтемелер, жиі бұзылады) · [login] аккаунт қажет. Кез келген басқа жария бетті әмбебап экстрактормен көріп бағамын."
    search:
      prompt: "Сайт атауының бір бөлігін жазыңыз, мысалы `tiktok` немесе `pixiv`. Бос хабар тізімді қайтарады."
      empty: "«{query}» бойынша ештеңе табылмады. Әмбебап экстрактор бәрібір көтере алады: жай сілтемені жіберіңіз."
      found: "Табылды: {count}. Көрсеткілермен парақтаңыз немесе сұрауды нақтылаңыз."
  stats:
    - "*Сіздің пайдалануыңыз*"
    - ""
    - "Соңғы бір сағат: {jobs_hour} жүктеу"
    - "Бүгін: {jobs_today} жүктеу, {bytes_today}"
  stats.recent: "Соңғылар:"
  admin:
    - "*Админ*"
    - ""
    - "Қозғалтқыш: {tools}"
    - "Тапсырмалар: {active} белсенді, {queued} кезекте"
    - "Қойма: {vault}"
    - "Пайдаланушылар: {users}"
  reload:
    done: "Мәтіндер мен дереккөз каталогы қайта жүктелді ({sources} дереккөз)."
  flood: "Тым көп хабар қатарынан. Маған бірнеше секунд беріңіз."
  warning:
    audio_raw: "Ескерту: серверде ffmpeg орнатылмаған, сондықтан аудио mp3 орнына бастапқы контейнерде жеткізілді."
  pointer:
    dm: "Ботпен жеке әңгімеңізде ашылды."
  hint:
    no_url: "Бұл хабардан сілтеме таппадым. `https://youtube.com/watch?v=…` сияқты URL қойыңыз, мен медианы әкелемін."
  prompt:
    url: "Сақтағыңыз келетін сілтемені жіберіңіз. Болдырмау: /stop."
  cancel:
    none: "Болдырмайтын белсенді жүктеулеріңіз жоқ."
    done: "Болдырылмаған жүктеулер: {count}."
  status:
    queued: "*{host}* дереккөзінен сақтап жатырмын…"
    files: "Осы уақытқа дейін жеткізілген файлдар: {count}"
    progress: "Жүктелуде… {percent}%"
    done: "{seconds} с-та дайын · файлдар: {count} · {size}"
  error:
    not_owner: "Бұл команда бот иесіне арналған."
    unknown_command: "Белгісіз команда. Тізімді /help жібереді."
    invalid_url: "Бұл жарамды http(s) сілтемесіне ұқсамайды."
    queue_full: "Жүктеу кезегі қазір толы. Бір минуттан кейін көріңіз."
    concurrent: "Сізде қазірдің өзінде {count} жүктеу жүріп жатыр. Оларды күтіңіз немесе Stop басыңыз."
    quota_hour: "Сағаттық лимитке жетті ({limit} жүктеу). Кейінірек көріңіз."
    quota_day: "Күндік лимитке жетті ({limit} жүктеу). Ертеңге дейін."
    quota_bytes: "Күндік трафик лимитіне жетті ({limit}). Ертеңге дейін."
    source_disabled: "«{title}» дереккөзін осы ботта әкімші өшірген."
    vault_full: "Сервердің диск қоймасы толы. Кейінірек көріңіз."
    blocked_type: "«{file}» файлы орындалатын түр немесе скрипт - мен ондайды жеткізбеймін."
    too_large: "Файл осы платформаға тым үлкен: {size} (лимит {cap})."
    too_large_link:
      - "Файл мұнда жіберуге тым үлкен: {size} (лимит {cap})."
      - ""
      - "Тікелей сілтеме: {url}"
    cat:
      unsupported: "Бұл сілтеме қолдалмайды: оны ешбір экстрактор ала алмады."
      login_required: "Бұл мазмұн сайтта аккаунт талап етеді. Мен тек жария беттерді сақтаймын."
      age_restricted: "Жас шектеуі бар мазмұн: сайт оны кірусіз көрсетпейді."
      private: "Бұл мазмұн жеке немесе автор жойған."
      not_found: "Бет немесе медиа табылмады (404). Сілтемені тексеріңіз."
      unavailable: "Медиа қолжетімді емес: оны автор жойған немесе жасырған."
      geo_blocked: "Бұл мазмұн сервер өңірінде бұғатталған."
      live_stream: "Бұл тікелей эфир. Трансляция біткенде сілтемені қайта жіберіңіз."
      rate_limited: "Дереккөз қазір ботты шектеп отыр. Бірнеше минуттан кейін көріңіз."
      too_large: "Файл лимиттен асады, ал кішірек формат қолжетімсіз."
      timeout: "Жүктеу уақыт лимитінен асты. Өте үлкен немесе баяу дереккөз бе? Төменірек сапамен қайта көріңіз."
      tool_missing: "Серверде экстракция құралы жоқ. Бұл әкімшіге арналған мәселе."
      network: "Дереккөзбен байланыста желі қатесі. Қайта көріңіз."
      cancelled: "Жүктеу болдырылмады."
      unknown: "Жүктеу кезінде бірдеңе дұрыс болмады. Қайта көріңіз, қайталанса әкімшіге айтыңыз."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} / {total}"
    truncated: "Тек алғашқы {count} элемент, қалғаны бетте"

