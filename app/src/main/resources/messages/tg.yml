# Tajik messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*Ба ман пайванд фиристед, ман файлро меорам.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo ва боз садҳо сомонаи дигар: видео, шортс, аксҳо, албомҳо, GIF, мусиқӣ."
    - ""
    - "Танҳо пайвандро ба чат гузоред. Фармон лозим нест."
  help:
    command: "*{command}* {description}"
    tip: "Ва соддатарин аз ҳама: ба ман танҳо пайванд фиристед."
  about:
    - "*Saver Bot*"
    - ""
    - "Боргири медиавии бисёрплатформаӣ: {sources} манбаъ дар каталог ба ғайр аз он ягон саҳифаи оммавӣ ҳамчун захира."
    - ""
    - "Версия: {version}"
    - "Ҳуқуқи муаллиф ва қоидаҳои сомонаҳоро эҳтиром кунед: танҳо он чизеро, ки иҷозат доред, нигоҳ доред."
  settings:
    - "*Танзимот*"
    - ""
    - "Сифат: {quality}"
    - "Забон: {language}"
  quality:
    title: "Сифати боргириҳоро интихоб кунед. Он ба ҳама дархостҳои нав татбиқ мешавад."
    set: "Сифат: *{quality}*. Боргириҳои нав онро истифода мебаранд."
  lang:
    choose: "Забони худро интихоб кунед:"
    set: "Забон иваз шуд."
  sources:
    title: "*Манбаъҳои дастгирӣ: {count}*"
    legend: "[ok] кор мекунад · [limited] қисман (танҳо пайвандҳои оммавӣ, аксар вақт мешиканад) · [login] ҳисоб лозим. Ҳар саҳифаи оммавии дигарро бо экстрактори умумӣ кӯшиш мекунам."
    search:
      prompt: "Қисме аз номи сомонаро нависед, масалан `tiktok` ё `pixiv`. Паёми холӣ рӯйхатро бармегардонад."
      empty: "Барои «{query}» ҳеҷ чиз ёфт нашуд. Экстрактори умумӣ шояд барояд: танҳо пайвандро фиристед."
      found: "Ёфт шуд: {count}. Бо тирҳо варақ кунед ё дархостро дақиқ кунед."
  stats:
    - "*Истифодаи шумо*"
    - ""
    - "Соати охир: {jobs_hour} боргирӣ"
    - "Имрӯз: {jobs_today} боргирӣ, {bytes_today}"
  stats.recent: "Охирон:"
  admin:
    - "*Админ*"
    - ""
    - "Муҳаррик: {tools}"
    - "Вазифаҳо: {active} фаъол, {queued} дар навбат"
    - "Хазина: {vault}"
    - "Истифодабарандагон: {users}"
  reload:
    done: "Матнҳо ва каталоги манбаъҳо аз нав бор шуданд ({sources} манбаъ)."
  flood: "Аз ҳад зиёд паёмҳо пай дар пай. Ба ман чанд сония диҳед."
  warning:
    audio_raw: "Эзоҳ: дар сервер ffmpeg насб нест, бинобар ин аудио ба ҷои mp3 дар контейнери аслӣ расонида шуд."
  pointer:
    dm: "Дар гуфтугӯи шахсии шумо бо бот кушода шуд."
  hint:
    no_url: "Дар он паём пайванд ёфт нашуд. URL-е монанди `https://youtube.com/watch?v=…` гузоред ва ман медиаро мегирам."
  prompt:
    url: "Пайвандеро, ки нигоҳ доштан мехоҳед, фиристед. Бекоркунӣ бо /stop."
  cancel:
    none: "Шумо боргирии фаъоле надоред, ки бекор кунед."
    done: "Боргириҳои бекоршуда: {count}."
  status:
    queued: "Аз *{host}* нигоҳ дошта истодаам…"
    files: "Файлҳои то ҳол расонидашуда: {count}"
    progress: "Дар ҳоли боргирӣ… {percent}%"
    done: "Тайёр дар {seconds} с · файлҳо: {count} · {size}"
  error:
    not_owner: "Ин фармон барои соҳиби бот аст."
    unknown_command: "Фармони номаълум. /help рӯйхатро мефиристад."
    invalid_url: "Ин ба пайванди дурусти http(s) монанд нест."
    queue_full: "Навбати боргирӣ ҳоло пур аст. Баъд аз як дақиқа кӯшиш кунед."
    concurrent: "Шумо аллакай {count} боргирии раванда доред. Онҳоро интизор шавед ё Stop-ро пахш кунед."
    quota_hour: "Ҳадди соатӣ расида шуд ({limit} боргирӣ). Баъдтар кӯшиш кунед."
    quota_day: "Ҳадди рӯзона расида шуд ({limit} боргирӣ). То фардо."
    quota_bytes: "Ҳадди рӯзонаи трафик расида шуд ({limit}). То фардо."
    source_disabled: "Манбаи «{title}» дар ин бот аз ҷониби администратор хомӯш шудааст."
    vault_full: "Хазинаи диски сервер пур аст. Баъдтар кӯшиш кунед."
    blocked_type: "Файли «{file}» навъи иҷрошаванда ё скрипт аст - чунин чизро намерасонам."
    too_large: "Файл барои ин платформа аз ҳад калон аст: {size} (ҳадд {cap})."
    too_large_link:
      - "Файл барои фиристодан ба ин ҷо аз ҳад калон аст: {size} (ҳадд {cap})."
      - ""
      - "Пайванди мустақим: {url}"
    cat:
      unsupported: "Ин пайванд дастгирӣ намешавад: ҳеҷ экстрактор онро гирифта натавонист."
      login_required: "Ин мундариҷа дар сомона ҳисоб талаб мекунад. Ман танҳо саҳифаҳои оммавиро нигоҳ медорам."
      age_restricted: "Мундариҷа бо маҳдудияти синну сол: сомона онро бе вуруд нишон намедиҳад."
      private: "Ин мундариҷа шахсӣ аст ё муаллиф онро нест кардааст."
      not_found: "Саҳифа ё медиа ёфт нашуд (404). Пайвандро санҷед."
      unavailable: "Медиа дастрас нест: онро муаллиф нест карда ё пинҳон кардааст."
      geo_blocked: "Ин мундариҷа дар минтақаи сервер баста шудааст."
      live_stream: "Ин пахши мустақим аст. Вақте пахш тамом шавад, пайвандро дубора фиристед."
      rate_limited: "Манбаъ ҳоло ботро маҳдуд мекунад. Баъд аз чанд дақиқа кӯшиш кунед."
      too_large: "Файл аз ҳадд мегузарад ва формати хурдтар дастрас нест."
      timeout: "Боргирӣ аз ҳадди вақт гузашт. Манбаи азим ё суст? Дубора кӯшиш кунед, шояд бо сифати пасттар."
      tool_missing: "Дар сервер асбоби экстрактсия нест. Ин барои администратор аст."
      network: "Хатои шабака ҳангоми гуфтугӯ бо манбаъ. Дубора кӯшиш кунед."
      cancelled: "Боргирӣ бекор шуд."
      unknown: "Ҳангоми боргирӣ чизе хато рафт. Дубора кӯшиш кунед ва такрор шавад, ба администратор гӯед."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} аз {total}"
    truncated: "Танҳо аввалин {count} унсур, боқимонда дар саҳифа аст"

