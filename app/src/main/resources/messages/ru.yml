# Русские сообщения. Плоские точечные ключи или вложенные карты - вложенность
# раскрывается в точечные ключи.
message:
  start:
    - "*Пришли ссылку - я принесу файл.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo и еще сотня площадок: видео, шортсы, фото, альбомы, гифки, музыка."
    - ""
    - "Просто вставь ссылку в чат. Команда не нужна."
  help:
    command: "*{command}* {description}"
    tip: "И самое простое: просто пришли мне ссылку."
  about:
    - "*Saver Bot*"
    - ""
    - "Мультиплатформенный загрузчик медиа: {sources} источников в каталоге плюс любая публичная страница как запасной вариант."
    - ""
    - "Версия: {version}"
    - "Уважайте авторские права и правила площадок: сохраняйте только то, что вам разрешено сохранять."
  settings:
    - "*Настройки*"
    - ""
    - "Качество: {quality}"
    - "Язык: {language}"
  quality:
    title: "Выберите качество загрузок. Оно применяется ко всем новым запросам."
    set: "Качество: *{quality}*. Новые загрузки будут идти в нем."
  lang:
    choose: "Выберите язык:"
    set: "Язык переключен."
  sources:
    title: "*Поддерживаемые источники: {count}*"
    legend: "[ok] работает · [limited] частично (только публичные ссылки, иногда ломается) · [login] нужен аккаунт. Любую другую публичную страницу я попробую через универсальный экстрактор."
    search:
      prompt: "Введите часть названия сайта, например `tiktok` или `pixiv`. Пустое сообщение вернет список."
      empty: "По запросу «{query}» ничего не нашлось. Универсальный экстрактор все равно может справиться: просто пришлите ссылку."
      found: "Нашлось: {count}. Листайте стрелками или уточните запрос."
  stats:
    - "*Ваша статистика*"
    - ""
    - "За час: {jobs_hour} загрузок"
    - "Сегодня: {jobs_today} загрузок, {bytes_today}"
  stats.recent: "Последние:"
  admin:
    - "*Админ*"
    - ""
    - "Движок: {tools}"
    - "Задачи: {active} активных, {queued} в очереди"
    - "Хранилище: {vault}"
    - "Пользователи: {users}"
  reload:
    done: "Словари и каталог источников перезагружены ({sources})."
  flood: "Слишком много сообщений подряд. Дайте мне пару секунд."
  warning:
    audio_raw: "Примечание: на сервере нет ffmpeg, поэтому аудио доставлено в исходном контейнере, а не в mp3."
  pointer:
    dm: "Открыл в личных сообщениях с ботом."
  hint:
    no_url: "Я не нашел ссылку в этом сообщении. Вставь URL вида `https://youtube.com/watch?v=…`, и я скачаю медиа."
  prompt:
    url: "Пришлите ссылку, которую нужно сохранить. Отмена: /stop."
  cancel:
    none: "У вас нет активных загрузок для отмены."
    done: "Отменено загрузок: {count}."
  status:
    queued: "Сохраняю с *{host}*…"
    files: "Файлов готово: {count}"
    progress: "Скачиваю… {percent}%"
    done: "Готово за {seconds} с · файлов: {count} · {size}"
  error:
    not_owner: "Эта команда только для владельца бота."
    unknown_command: "Неизвестная команда. Список пришлет /help."
    invalid_url: "Это не похоже на корректную http(s) ссылку."
    queue_full: "Очередь загрузок сейчас переполнена. Попробуйте через минуту."
    concurrent: "У вас уже {count} загрузок в работе. Дождитесь их или нажмите «Стоп»."
    quota_hour: "Достигнут часовой лимит ({limit} загрузок). Попробуйте позже."
    quota_day: "Достигнут дневной лимит ({limit} загрузок). До завтра."
    quota_bytes: "Дневной лимит трафика исчерпан ({limit}). До завтра."
    source_disabled: "Источник «{title}» отключен на этом боте администратором."
    vault_full: "Дисковое хранилище сервера переполнено. Попробуйте позже."
    blocked_type: "Файл «{file}» - исполняемый/скриптовый тип, такие я не доставляю."
    too_large: "Файл слишком большой для этой платформы: {size} (лимит {cap})."
    too_large_link:
      - "Файл слишком большой, чтобы отправить его здесь: {size} (лимит {cap})."
      - ""
      - "Прямая ссылка: {url}"
    cat:
      unsupported: "Эта ссылка не поддерживается: ни один экстрактор не смог ее взять."
      login_required: "Этот контент требует аккаунт на сайте. Я сохраняю только публичные страницы."
      age_restricted: "Контент с возрастным ограничением: сайт не показывает его без входа."
      private: "Этот контент приватный или удален автором."
      not_found: "Страница или медиа не найдены (404). Проверьте ссылку."
      unavailable: "Медиа недоступно: оно удалено или скрыто автором."
      geo_blocked: "Этот контент заблокирован в регионе сервера."
      live_stream: "Это прямой эфир. Пришлите ссылку снова, когда трансляция закончится."
      rate_limited: "Источник сейчас ограничивает частоту запросов бота. Повторите через несколько минут."
      too_large: "Файл больше лимита по размеру, и формата поменьше источник не дает."
      timeout: "Загрузка превысила тайм-аут. Огромный или медленный источник? Попробуйте снова, возможно, с меньшим качеством."
      tool_missing: "На сервере отсутствует инструмент извлечения. Это вопрос к администратору."
      network: "Сетевая ошибка при обращении к источнику. Попробуйте снова."
      cancelled: "Загрузка отменена."
      unknown: "Что-то пошло не так во время загрузки. Попробуйте еще раз, а при повторе расскажите администратору."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} из {total}"
    truncated: "Только первые {count} элементов, остальные на странице"

button:
  back: "Назад"
  settings: "Настройки"
  sources: "Источники"
  language: "Язык"
  about: "О боте"
  help: "Помощь"
