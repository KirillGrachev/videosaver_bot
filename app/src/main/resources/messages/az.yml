# Azerbaijani messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*Mənə link göndər, faylı gətirim.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo və yüzdən çox başqa sayt: videolar, shortslar, fotolar, albomlar, GIF, musiqi."
    - ""
    - "Linki sadəcə söhbətə yapışdır. Komanda lazım deyil."
  help:
    command: "*{command}* {description}"
    tip: "Və ən sadəsi: mənə sadəcə bir link göndər."
  about:
    - "*Saver Bot*"
    - ""
    - "Çoxplatformalı media yükləyicisi: kataloqda {sources} mənbə, üstəlik ehtiyat olaraq istənilən ictimai səhifə."
    - ""
    - "Versiya: {version}"
    - "Müəllif hüquqlarına və saytların qaydalarına hörmət et: yalnız saxlamağa icazən olanı saxla."
