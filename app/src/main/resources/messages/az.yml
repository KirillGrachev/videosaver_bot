    search:
      prompt: "Sayt adının bir hissəsini yaz, məsələn `tiktok` və ya `pixiv`. Boş mesaj siyahını qaytarır."
      empty: "«{query}» üçün heç nə tapılmadı. Ümumi ekstraktor yenə də bacara bilər: sadəcə linki göndər."
