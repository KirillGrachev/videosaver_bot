      age_restricted: "Yaş məhdudiyyəti olan məzmun: sayt onu girişsiz göstərmir."
      private: "Bu məzmun şəxsidir və ya müəllif silib."
      not_found: "Səhifə və ya media tapılmadı (404). Linki yoxla."
      unavailable: "Media əlçatan deyil: müəllif tərəfindən silinib və ya gizlədilib."
      geo_blocked: "Bu məzmun server regionunda bloklanıb."
      live_stream: "Bu canlı yayımdır. Yayım bitəndə linki yenidən göndər."
      rate_limited: "Mənbə indi botu məhdudlaşdırır. Bir neçə dəqiqə sonra cəhd et."
      too_large: "Fayl limiti aşır və daha kiçik format mövcud deyil."
      timeout: "Yükləmə vaxt limitini aşdı. Nəhəng və ya yavaş mənbə? Yenidən cəhd et, bəlkə daha aşağı keyfiyyətlə."
