      network: "Mənbə ilə əlaqədə şəbəkə xətası. Yenidən cəhd et."
      cancelled: "Yükləmə ləğv edildi."
      unknown: "Yükləmə zamanı nəsə xəta getdi. Yenidən cəhd et və təkrarlanarsa, administratora de."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} / {total}"
    truncated: "Yalnız ilk {count} element, qalanı səhifədədir"

