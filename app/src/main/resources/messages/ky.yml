# Kyrgyz messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*Мага шилтеме жөнөт, мен файлды алып келем.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo жана дагы жүздөн ашуун сайт: видео, шортс, сүрөттөр, альбомдор, GIF, музыка."
    - ""
    - "Шилтемени жөн эле чатка кой. Команда керек эмес."
  help:
    command: "*{command}* {description}"
    tip: "Эң жөнөкөйү: мага жөн эле шилтеме жөнөт."
  about:
    - "*Saver Bot*"
    - ""
    - "Көп платформалуу медиа жүктөгүч: каталогдо {sources} булак, кошумча каалаган ачык барак резерв катары."
    - ""
    - "Версия: {version}"
    - "Автордук укукту жана сайттардын эрежесин сыйла: сактоого уруксатың бар нерсени гана сакта."
  settings:
    - "*Жөндөөлөр*"
    - ""
    - "Сапат: {quality}"
    - "Тил: {language}"
  quality:
    title: "Жүктөөлөрдүн сапатын танда. Ал бардык жаңы сурамдарга колдонулат."
    set: "Сапат: *{quality}*. Жаңы жүктөөлөр ушуну колдонот."
  lang:
    choose: "Тилиңди танда:"
    set: "Тил алмаштырылды."
  sources:
    title: "*Колдоого алынган булактар: {count}*"
    legend: "[ok] иштейт · [limited] жарым-жартылай (ачык шилтемелер гана, көп бузулат) · [login] аккаунт керек. Башка каалаган ачык баракты универсал экстрактор менен көрөм."
    search:
      prompt: "Сайттын аталышынын бир бөлүгүн жаз, мисалы `tiktok` же `pixiv`. Бош билдирүү тизмени кайтарат."
      empty: "«{query}» боюнча эч нерсе табылган жок. Универсал экстрактор баары бир көтөрө алат: жөн эле шилтемени жөнөт."
      found: "Табылды: {count}. Жебелер менен баракта же сурамды такта."
  stats:
    - "*Сенин колдонууң*"
    - ""
    - "Акыркы саат: {jobs_hour} жүктөө"
    - "Бүгүн: {jobs_today} жүктөө, {bytes_today}"
  stats.recent: "Акыркылар:"
  admin:
    - "*Админ*"
    - ""
    - "Кыймылдаткыч: {tools}"
    - "Тапшырмалар: {active} активдүү, {queued} кезекте"
    - "Сактагыч: {vault}"
    - "Колдонуучулар: {users}"
  reload:
    done: "Тексттер жана булактар каталогу кайта жүктөлдү ({sources} булак)."
  flood: "Өтө көп билдирүү катары менен. Мага бир нече секунд бер."
  warning:
    audio_raw: "Эскертүү: серверде ffmpeg орнотулган эмес, ошондуктан аудио mp3 ордуна баштапкы контейнерде жеткирилди."
  pointer:
    dm: "Бот менен жеке маекте ачылды."
  hint:
    no_url: "Бул билдирүүдөн шилтеме тапкан жокмун. `https://youtube.com/watch?v=…` сыяктуу URL кой, мен медианы алып келем."
  prompt:
    url: "Сактагың келген шилтемени жөнөт. Жокко чыгаруу: /stop."
  cancel:
    none: "Жокко чыгара турган активдүү жүктөөлөрүң жок."
    done: "Жокко чыгарылган жүктөөлөр: {count}."
  status:
    queued: "*{host}* булагынан сакталууда…"
    files: "Ушул убакка чейин жеткирилген файлдар: {count}"
    progress: "Жүктөлүүдө… {percent}%"
    done: "{seconds} с-та даяр · файлдар: {count} · {size}"
  error:
    not_owner: "Бул команда боттун ээси үчүн."
    unknown_command: "Белгисиз команда. Тизмени /help жөнөтөт."
    invalid_url: "Бул жарактуу http(s) шилтемесине окшошпойт."
    queue_full: "Жүктөө кезеги азыр толук. Бир мүнөттөн кийин көр."
    concurrent: "Сенде азыр эле {count} жүктөө жүрүп жатат. Аларды күт же Stop бас."
    quota_hour: "Сааттык лимитке жетти ({limit} жүктөө). Кийинчерээк көр."
    quota_day: "Күндүк лимитке жетти ({limit} жүктөө). Эртеңге чейин."
    quota_bytes: "Күндүк трафик лимитине жетти ({limit}). Эртеңге чейин."
    source_disabled: "«{title}» булагын ушул ботто администратор өчүргөн."
    vault_full: "Сервердин диск сактагычы толук. Кийинчерээк көр."
    blocked_type: "«{file}» файлы аткарылуучу түр же скрипт - мындайды мен жеткирбейм."
    too_large: "Файл бул платформага өтө чоң: {size} (лимит {cap})."
    too_large_link:
      - "Файл бул жерге жөнөтүүгө өтө чоң: {size} (лимит {cap})."
      - ""
      - "Түз шилтеме: {url}"
    cat:
      unsupported: "Бул шилтеме колдоого алынбайт: аны эч бир экстрактор ала алган жок."
      login_required: "Бул мазмун сайтта аккаунт талап кылат. Мен ачык барактарды гана сактайм."
      age_restricted: "Жаш чектөөсү бар мазмун: сайт аны кирүүсүз көрсөтпөйт."
      private: "Бул мазмун жеке же автор өчүргөн."
      not_found: "Барак же медиа табылган жок (404). Шилтемени текшер."
      unavailable: "Медиа жеткиликтүү эмес: аны автор өчүргөн же жашырган."
      geo_blocked: "Бул мазмун сервер аймагында бөгөттөлгөн."
      live_stream: "Бул түз эфир. Трансляция бүткөндө шилтемени кайра жөнөт."
      rate_limited: "Булак азыр ботту чектеп жатат. Бир нече мүнөттөн кийин көр."
      too_large: "Файл лимиттен ашат, ал эми кичирээк формат жеткиликсиз."
      timeout: "Жүктөө убакыт лимитинен ашты.Өтө чоң же жай булакпы? Кайра көр, балким төмөнүрөөк сапат менен."
      tool_missing: "Серверде экстракция куралы жок. Бул администраторго арналган маселе."
      network: "Булак менен байланышта тармак катасы. Кайра көр."
      cancelled: "Жүктөө жокко чыгарылды."
      unknown: "Жүктөө учурунда бир нерсе туура эмес болду. Кайра көр, кайталанса администраторго айт."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} / {total}"
    truncated: "Алгачкы {count} элемент гана, калганы баракта"

button:
  back: "Артка"
  settings: "Жөндөөлөр"
  sources: "Булактар"
