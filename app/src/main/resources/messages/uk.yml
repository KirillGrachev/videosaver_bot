# Українські повідомлення. Плоскі точкові ключі або вкладені карти - вкладеність
# розкривається в точкові ключі.
message:
  start:
    - "*Надішли посилання - я принесу файл.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo та ще сотня майданчиків: відео, шортси, фото, альбоми, гіфки, музика."
    - ""
    - "Просто встав посилання в чат. Команда не потрібна."
  help:
    command: "*{command}* {description}"
    tip: "І найпростіше: просто надішли мені посилання."
  about:
    - "*Saver Bot*"
    - ""
    - "Мультиплатформовий завантажувач медіа: {sources} джерел у каталозі плюс будь-яка публічна сторінка як запасний варіант."
    - ""
    - "Версія: {version}"
    - "Поважайте авторські права та правила майданчиків: зберігайте лише те, що вам дозволено зберігати."
  settings:
    - "*Налаштування*"
    - ""
    - "Якість: {quality}"
    - "Мова: {language}"
  quality:
    title: "Оберіть якість завантажень. Вона застосовується до всіх нових запитів."
    set: "Якість: *{quality}*. Нові завантаження йтимуть у ній."
  lang:
    choose: "Оберіть мову:"
    set: "Мову переключено."
  sources:
    title: "*Підтримувані джерела: {count}*"
    legend: "[ok] працює · [limited] частково (лише публічні посилання, іноді ламається) · [login] потрібен акаунт. Будь-яку іншу публічну сторінку я спробую через універсальний екстрактор."
    search:
      prompt: "Введіть частину назви сайту, наприклад `tiktok` або `pixiv`. Порожнє повідомлення поверне список."
      empty: "За запитом «{query}» нічого не знайшлося. Універсальний екстрактор усе одно може впоратися: просто надішліть посилання."
      found: "Знайдено: {count}. Гортайте стрілками або уточніть запит."
  stats:
    - "*Ваша статистика*"
    - ""
    - "За годину: {jobs_hour} завантажень"
    - "Сьогодні: {jobs_today} завантажень, {bytes_today}"
  stats.recent: "Останні:"
  admin:
    - "*Адмін*"
    - ""
    - "Рушій: {tools}"
    - "Задачі: {active} активних, {queued} у черзі"
    - "Сховище: {vault}"
    - "Користувачі: {users}"
  reload:
    done: "Словники та каталог джерел перезавантажено ({sources})."
  flood: "Забагато повідомлень поспіль. Дайте мені кілька секунд."
  warning:
    audio_raw: "Примітка: на сервері немає ffmpeg, тому аудіо доставлено в оригінальному контейнері, а не в mp3."
  hint:
    no_url: "Я не знайшов посилання в цьому повідомленні. Встав URL вигляду `https://youtube.com/watch?v=…`, і я завантажу медіа."
  prompt:
    url: "Надішліть посилання, яке потрібно зберегти. Скасування: /stop."
  cancel:
    none: "У вас немає активних завантажень для скасування."
    done: "Скасовано завантажень: {count}."
  status:
    queued: "Зберігаю з *{host}*…"
    files: "Файлів готово: {count}"
    progress: "Завантажую… {percent}%"
    done: "Готово за {seconds} с · файлів: {count} · {size}"
  error:
    not_owner: "Ця команда лише для власника бота."
    unknown_command: "Невідома команда. Список надішле /help."
    invalid_url: "Це не схоже на коректне http(s) посилання."
    queue_full: "Черга завантажень зараз переповнена. Спробуйте за хвилину."
    concurrent: "У вас уже {count} завантажень у роботі. Дочекайтеся їх або натисніть «Стоп»."
    quota_hour: "Досягнуто погодинний ліміт ({limit} завантажень). Спробуйте пізніше."
    quota_day: "Досягнуто денний ліміт ({limit} завантажень). До завтра."
    quota_bytes: "Денний ліміт трафіку вичерпано ({limit}). До завтра."
    source_disabled: "Джерело «{title}» вимкнено на цьому боті адміністратором."
    vault_full: "Дискове сховище сервера переповнене. Спробуйте пізніше."
    too_large: "Файл завеликий для цієї платформи: {size} (ліміт {cap})."
    blocked_type: "Файл «{file}» - виконуваний/скриптовий тип, такі я не доставляю."
    too_large_link:
      - "Файл завеликий, щоб надіслати його тут: {size} (ліміт {cap})."
      - ""
      - "Пряме посилання: {url}"
    cat:
      unsupported: "Це посилання не підтримується: жоден екстрактор не зміг його взяти."
      login_required: "Цей контент потребує акаунт на сайті. Я зберігаю лише публічні сторінки."
      age_restricted: "Контент із віковим обмеженням: сайт не показує його без входу."
      private: "Цей контент приватний або видалений автором."
      not_found: "Сторінку або медіа не знайдено (404). Перевірте посилання."
      unavailable: "Медіа недоступне: його видалено або приховано автором."
      geo_blocked: "Цей контент заблоковано в регіоні сервера."
      live_stream: "Це прямий ефір. Надішліть посилання знову, коли трансляція завершиться."
      rate_limited: "Джерело зараз обмежує частоту запитів бота. Повторіть за кілька хвилин."
      too_large: "Файл більший за ліміт, і меншого формату джерело не дає."
      timeout: "Завантаження перевищило тайм-аут. Величезне або повільне джерело? Спробуйте знову, можливо, з меншою якістю."
      tool_missing: "На сервері відсутній інструмент видобування. Це питання до адміністратора."
      network: "Мережева помилка під час звернення до джерела. Спробуйте знову."
      cancelled: "Завантаження скасовано."
      unknown: "Щось пішло не так під час завантаження. Спробуйте ще раз, а якщо повториться - розкажіть адміністратору."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} з {total}"
    truncated: "Лише перші {count} елементів, решта на сторінці"
  pointer:
    dm: "Відкрив в особистих повідомленнях із ботом."

button:
  back: "Назад"
  settings: "Налаштування"
  sources: "Джерела"
  language: "Мова"
  about: "Про бота"
  help: "Довідка"
  stats: "Моя статистика"
  quality_menu: "Якість"
  stop: "Стоп"
  search: "Пошук"
  original: "Орігінал"
  github: "GitHub"
  reload: "Перезавантажити словники"
  open_link: "Відкрити посилання"
  quality:
    best: "Найкраща"
    "1080": "1080p"
    "720": "720p"
    "480": "480p"
    audio: "Аудіо (mp3)"
    current_suffix: " (поточна)"

command:
  desc:
    start: "головне меню"
    help: "що я вмію"
    save: "завантажити за посиланням (або просто надішліть посилання)"
    stop: "скасувати активні завантаження"
    quality: "якість відео / лише аудіо"
    settings: "ваші налаштування"
    sources: "список підтримуваних сайтів"
    stats: "ваше використання та останні задачі"
    lang: "мова"
    about: "про бота"
    admin: "стан рушія (власник)"
    reload: "перезавантажити словники (власник)"
