# Bulgarian messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*Прати ми линк и ще донеса файла.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo и още над сто сайта: видео, shorts, снимки, албуми, GIF-ове, музика."
    - ""
    - "Просто постави линка в чата. Не е нужна команда."
  help:
    command: "*{command}* {description}"
    tip: "И най-простото от всичко: просто ми прати линк."
  about:
    - "*Saver Bot*"
    - ""
    - "Мултиплатформен сваляч на медия: {sources} източника в каталога плюс всяка публична страница като резерва."
    - ""
    - "Версия: {version}"
    - "Спазвай авторските права и правилата на сайтовете: запазвай само това, което имаш право да запазваш."
  settings:
    - "*Настройки*"
    - ""
    - "Качество: {quality}"
    - "Език: {language}"
  quality:
    title: "Избери качеството на свалянията. То важи за всички нови заявки."
    set: "Качество: *{quality}*. Новите сваляния ще го ползват."
  lang:
    choose: "Избери своя език:"
    set: "Езикът е сменен."
  sources:
    title: "*Поддържани източници: {count}*"
    legend: "[ok] работи · [limited] частично (само публични линкове, често се чупи) · [login] нужда от профил. Всяка друга публична страница я пробвам с универсалния екстрактор."
    search:
      prompt: "Напиши част от името на сайта, например `tiktok` или `pixiv`. Празно съобщение връща списъка."
      empty: "Нищо не се намери за „{query}“. Универсалният екстрактор може все пак да се справи: просто прати линка."
      found: "Намерени: {count}. Листай със стрелките или уточни заявката."
  stats:
    - "*Твоето използване*"
    - ""
    - "Последния час: {jobs_hour} сваляния"
    - "Днес: {jobs_today} сваляния, {bytes_today}"
  stats.recent: "Последни:"
  admin:
    - "*Админ*"
    - ""
    - "Двигател: {tools}"
    - "Задачи: {active} активни, {queued} на опашка"
    - "Хранилище: {vault}"
    - "Потребители: {users}"
  reload:
    done: "Текстовете и каталогът с източници са презаредени ({sources} източника)."
  flood: "Твърде много съобщения наведнъж. Дай ми няколко секунди."
  warning:
    audio_raw: "Забележка: на сървъра няма ffmpeg, затова аудиото е доставено в оригиналния контейнер вместо mp3."
  pointer:
    dm: "Отворено в личния ти разговор с бота."
  hint:
    no_url: "Не намерих линк в това съобщение. Постави URL като `https://youtube.com/watch?v=…` и ще взема медията."
  prompt:
    url: "Прати ми линка, който искаш да запазиш. Отмяна с /stop."
  cancel:
    none: "Нямаш активни сваляния за отмяна."
    done: "Отменени сваляния: {count}."
  status:
    queued: "Запазвам от *{host}*…"
    files: "Доставени файлове досега: {count}"
    progress: "Свалям… {percent}%"
    done: "Готово за {seconds} с · файлове: {count} · {size}"
  error:
    not_owner: "Тази команда е за собственика на бота."
    unknown_command: "Непозната команда. /help дава списъка."
    invalid_url: "Това не прилича на валиден http(s) линк."
    queue_full: "Опашката за сваляне е пълна в момента. Опитай след минута."
    concurrent: "Вече имаш {count} течащи сваляния. Изчакай ги или натисни Stop."
    quota_hour: "Часовият лимит е достигнат ({limit} сваляния). Опитай по-късно."
    quota_day: "Дневният лимит е достигнат ({limit} сваляния). До утре."
    quota_bytes: "Дневният лимит за трафик е достигнат ({limit}). До утре."
    source_disabled: "Източникът „{title}“ е изключен в този бот от администратора."
    vault_full: "Дисковото хранилище на сървъра е пълно. Опитай по-късно."
    blocked_type: "Файлът „{file}“ е изпълним или скриптов тип - такива не доставям."
    too_large: "Файлът е твърде голям за тази платформа: {size} (лимит {cap})."
    too_large_link:
      - "Файлът е твърде голям, за да се прати тук: {size} (лимит {cap})."
      - ""
      - "Директен линк: {url}"
    cat:
      unsupported: "Този линк не се поддържа: нито един екстрактор не го взе."
      login_required: "Това съдържание изисква профил в сайта. Запазвам само публични страници."
      age_restricted: "Съдържание с възрастова граница: сайтът не го показва без вход."
      private: "Това съдържание е лично или изтрито от автора."
      not_found: "Страницата или медията не е намерена (404). Провери линка."
      unavailable: "Медията не е достъпна: изтрита или скрита от автора."
      geo_blocked: "Това съдържание е блокирано в региона на сървъра."
      live_stream: "Това е излъчване на живо. Прати линка отново, когато предаването свърши."
      rate_limited: "Източникът в момента ограничава бота. Опитай след няколко минути."
      too_large: "Файлът надвишава лимита и няма по-малък формат."
      timeout: "Свалянето надвиши времето за изчакване. Огромно или бавно източник? Опитай отново, може би с по-ниско качество."
      tool_missing: "Инструментът за извличане липсва на сървъра. Това е за администратора."
      network: "Мрежова грешка при връзка с източника. Опитай отново."
      cancelled: "Свалянето е отменено."
      unknown: "Нещо се обърка по време на свалянето. Опитай пак и ако се повтори, кажи на администратора."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} от {total}"
    truncated: "Само първите {count} елемента, останалото е на страницата"

button:
  back: "Назад"
  settings: "Настройки"
  sources: "Източници"
  language: "Език"
  about: "За бота"
  help: "Помощ"
  stats: "Моята статистика"
  quality_menu: "Качество"
  stop: "Стоп"
  search: "Търсене"
  original: "Оригинал"
  github: "GitHub"
  reload: "Презареди текстовете"
  open_link: "Отвори линка"
  quality:
    best: "Най-добро"
    "1080": "1080p"
    "720": "720p"
    "480": "480p"
    audio: "Аудио (mp3)"
    current_suffix: " (текущо)"

command:
  desc:
    start: "главно меню"
    help: "какво умея"
    save: "сваляне по линк (или просто прати линка)"
    stop: "отмени активните сваляния"
    quality: "качество на видео / само аудио"
    settings: "твоите настройки"
    sources: "списък с поддържани сайтове"
