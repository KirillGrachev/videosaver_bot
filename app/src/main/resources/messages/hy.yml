# Armenian messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*Ուղարկիր ինձ հղում, և ես կբերեմ ֆայլը։*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo և ավելի քան հարյուր այլ կայքեր՝ տեսանյութեր, շորտս, լուսանկարներ, ալբոմներ, GIF, երաժշտություն։"
    - ""
    - "Պարզապես տեղադրիր հղումը զրույցում։ Հրաման անհրաժեշտ չէ։"
  help:
    command: "*{command}* {description}"
    tip: "Եվ ամենապարզը՝ ուղղակի ինձ հղում ուղարկիր։"
  about:
    - "*Saver Bot*"
    - ""
    - "Բազմահարթակային մեդիա ներբեռնիչ՝ {sources} աղբյուր կատալոգում, գումարած ցանկացած հանրային էջ որպես պահեստային։"
    - ""
    - "Տարբերակ՝ {version}"
    - "Հարգիր հեղինակային իրավունքներն ու կայքերի կանոնները՝ պահպանիր միայն այն, ինչ պահպանելու թույլտվություն ունես։"
  settings:
    - "*Կարգավորումներ*"
    - ""
    - "Որակ՝ {quality}"
    - "Լեզու՝ {language}"
  quality:
    title: "Ընտրիր ներբեռնումների որակը։ Այն կիրառվում է բոլոր նոր հարցումների համար։"
    set: "Որակ՝ *{quality}*։ Նոր ներբեռնումները կօգտագործեն այն։"
  lang:
    choose: "Ընտրիր քո լեզուն՝"
    set: "Լեզուն փոխվեց։"
  sources:
    title: "*Աջակցվող աղբյուրներ՝ {count}*"
    legend: "[ok] աշխատում է · [limited] մասնակի (միայն հանրային հղումներ, հաճախ կոտրվում է) · [login] անհրաժեշտ է հաշիվ։ Ցանկացած այլ հանրային էջ փորձում եմ ընդհանուր քաղողով։"
    search:
      prompt: "Գրիր կայքի անվան մի մասը, օրինակ՝ `tiktok` կամ `pixiv`։ Դատարկ հաղորդագրությունը վերադարձնում է ցանկը։"
      empty: "«{query}» հարցմամբ ոչինչ չգտնվեց։ Ընդհանուր քաղողը միգուցե դեռ կարողանա՝ ուղղակի ուղարկիր հղումը։"
      found: "Գտնվեց՝ {count}։ Թերթիր սլաքներով կամ ճշգրտիր հարցումը։"
  stats:
    - "*Քո օգտագործումը*"
    - ""
    - "Վերջին ժամը՝ {jobs_hour} ներբեռնում"
    - "Այսօր՝ {jobs_today} ներբեռնում, {bytes_today}"
  stats.recent: "Վերջինները՝"
  admin:
    - "*Ադմին*"
    - ""
    - "Շարժիչ՝ {tools}"
    - "Աշխատանքներ՝ {active} ակտիվ, {queued} հերթում"
    - "Պահոց՝ {vault}"
    - "Օգտվողներ՝ {users}"
  reload:
    done: "Տեքստերն ու աղբյուրների կատալոգը վերաբեռնվեցին ({sources} աղբյուր)։"
  flood: "Չափազանց շատ հաղորդագրություններ անընդմեջ։ Տուր ինձ մի քանի վայրկյան։"
  warning:
    audio_raw: "Նշում․ սերվերում ffmpeg տեղադրված չէ, ուստի աուդիոն մատակարարվեց սկզբնական կոնտեյներով՝ mp3-ի փոխարեն։"
  pointer:
    dm: "Բացվեց բոտի հետ քո անձնական զրույցում։"
  hint:
    no_url: "Այդ հաղորդագրության մեջ հղում չգտա։ Տեղադրիր URL, օրինակ՝ `https://youtube.com/watch?v=…`, և ես կբերեմ մեդիան։"
  prompt:
    url: "Ուղարկիր այն հղումը, որը ցանկանում ես պահպանել։ Չեղարկում՝ /stop։"
  cancel:
    none: "Դու չունես չեղարկելու ակտիվ ներբեռնումներ։"
    done: "Չեղարկված ներբեռնումներ՝ {count}։"
  status:
    queued: "Պահպանում եմ *{host}* աղբյուրից…"
    files: "Մինչ այժմ մատակարարված ֆայլեր՝ {count}"
    progress: "Ներբեռնվում է… {percent}%"
    done: "Պատրաստ է {seconds} վ-ում · ֆայլեր՝ {count} · {size}"
  error:
    not_owner: "Այս հրամանը բոտի սեփականատիրոջ համար է։"
    unknown_command: "Անհայտ հրաման։ /help-ը կուղարկի ցանկը։"
    invalid_url: "Սա ճիշտ http(s) հղման նման չէ։"
    queue_full: "Ներբեռնումների հերթը հիմա լցված է։ Փորձիր մեկ րոպե անց։"
    concurrent: "Դու արդեն ունես {count} ընթացող ներբեռնում։ Սպասիր դրանց կամ սեղմիր Stop։"
    quota_hour: "Ժամային սահմանաչափը հասել է ({limit} ներբեռնում)։ Փորձիր ավելի ուշ։"
    quota_day: "Օրական սահմանաչափը հասել է ({limit} ներբեռնում)։ Մինչև վաղը։"
    quota_bytes: "Օրական տրաֆիկի սահմանաչափը հասել է ({limit})։ Մինչև վաղը։"
    source_disabled: "«{title}» աղբյուրն անջատված է այս բոտում ադմինիստրատորի կողմից։"
    vault_full: "Սերվերի սկավառակի պահոցը լցված է։ Փորձիր ավելի ուշ։"
    blocked_type: "«{file}» ֆայլը գործարկվող տեսակ է կամ սկրիպտ՝ դրանք ես չեմ մատակարարում։"
    too_large: "Ֆայլը չափազանց մեծ է այս հարթակի համար՝ {size} (սահման՝ {cap})։"
    too_large_link:
      - "Ֆայլը չափազանց մեծ է այստեղ ուղարկելու համար՝ {size} (սահման՝ {cap})։"
      - ""
      - "Ուղիղ հղում՝ {url}"
    cat:
      unsupported: "Այս հղումը չի աջակցվում՝ ոչ մի քաղող չկարողացավ վերցնել այն։"
      login_required: "Այս բովանդակությունը կայքում հաշիվ է պահանջում։ Ես պահպանում եմ միայն հանրային էջեր։"
      age_restricted: "Տարիքային սահմանափակում ունեցող բովանդակություն՝ կայքը չի ցուցադրում այն առանց մուտքի։"
      private: "Այս բովանդակությունը անձնական է կամ հեղինակը ջնջել է։"
      not_found: "Էջը կամ մեդիան չգտնվեց (404)։ Ստուգիր հղումը։"
      unavailable: "Մեդիան հասանելի չէ. այն ջնջվել է կամ թաքցվել հեղինակի կողմից։"
      geo_blocked: "Այս բովանդակությունը արգելափակված է սերվերի տարածաշրջանում։"
      live_stream: "Սա ուղիղ եթեր է։ Ուղարկիր հղումը նորից, երբ հեռարձակումն ավարտվի։"
      rate_limited: "Աղբյուրը հիմա սահմանափակում է բոտին։ Փորձիր մի քանի րոպե անց։"
      too_large: "Ֆայլը գերազանցում է սահմանը, և ավելի փոքր ձևաչափ կա։"
      timeout: "Ներբեռնումը գերազանցեց ժամանակի սահմանը։ Հսկայական կամ դանդաղ աղբյու՞ր։ Փորձիր նորից, գուցե ավելի ցածր որակով։"
      tool_missing: "Սերվերում բացակայում է քաղման գործիքը։ Սա ադմինիստրատորի հարց է։"
      network: "Ցանցային սխալ աղբյուրի հետ խոսելիս։ Փորձիր նորից։"
      cancelled: "Ներբեռնումը չեղարկվեց։"
      unknown: "Ինչ-որ բան սխալ գնաց ներբեռնման ընթացքում։ Փորձիր նորից, և կրկնվելու դեպքում ասա ադմինիստրատորին։"
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} / {total}"
    truncated: "Միայն առաջին {count} տարրերը, մնացածը էջում է"

