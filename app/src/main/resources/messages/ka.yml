# Georgian messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*მომაწოდე ბმული და ფაილს მოგიტან.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo და კიდევ ასზე მეტი საიტი: ვიდეო, შორტები, ფოტოები, ალბომები, GIF, მუსიკა."
    - ""
    - "უბრალოდ ჩასვი ბმული ჩატში. ბრძანება საჭირო არ არის."
  help:
    command: "*{command}* {description}"
    tip: "და ყველაზე მარტივი: უბრალოდ მომაწოდე ბმული."
  about:
    - "*Saver Bot*"
    - ""
    - "მრავალპლატფორმული მედია ჩამომტვირთავი: {sources} წყარო კატალოგში, დამატებით ნებისმიერი საჯარო გვერდი როგორც სარეზერვო."
    - ""
    - "ვერსია: {version}"
    - "პატივი ეცი საავტორო უფლებებსა და საიტების წესებს: შეინახე მხოლოდ ის, რისი შენახვაც შეგიძლია."
  settings:
    - "*პარამეტრები*"
    - ""
    - "ხარისხი: {quality}"
    - "ენა: {language}"
  quality:
    title: "აირჩიე ჩამოტვირთვების ხარისხი. ის მოქმედებს ყველა ახალ მოთხოვნაზე."
    set: "ხარისხი: *{quality}*. ახალი ჩამოტვირთვები მას გამოიყენებს."
  lang:
    choose: "აირჩიე შენი ენა:"
    set: "ენა გადართულია."
  sources:
    title: "*მხარდაჭერილი წყაროები: {count}*"
    legend: "[ok] მუშაობს · [limited] ნაწილობრივ (მხოლოდ საჯარო ბმულები, ხშირად ფუჭდება) · [login] საჭიროა ანგარიში. ნებისმიერ სხვა საჯარო გვერდს ვცდილობ უნივერსალური ექსტრაქტორით."
    search:
      prompt: "აკრიფე საიტის სახელის ნაწილი, მაგალითად `tiktok` ან `pixiv`. ცარიელი წერილი სიას დააბრუნებს."
      empty: "«{query}»-ზე ვერაფერი მოიძებნა. უნივერსალური ექსტრაქტორი შეიძლება მაინც გაუმკლავდეს: უბრალოდ მომაწოდე ბმული."
      found: "მოიძებნა: {count}. დაფურცლე ისრებით ან დააზუსტე ძიება."
  stats:
    - "*შენი გამოყენება*"
    - ""
    - "ბოლო საათი: {jobs_hour} ჩამოტვირთვა"
    - "დღეს: {jobs_today} ჩამოტვირთვა, {bytes_today}"
  stats.recent: "ბოლო:"
  admin:
    - "*ადმინი*"
    - ""
    - "ძრავა: {tools}"
    - "ამოცანები: {active} აქტიური, {queued} რიგში"
    - "საცავი: {vault}"
    - "მომხმარებლები: {users}"
  reload:
    done: "ტექსტები და წყაროების კატალოგი გადაიტვირთა ({sources} წყარო)."
  flood: "ზედმეტად ბევრი წერილი ზედიზედ. მომეცი რამდენიმე წამი."
  warning:
    audio_raw: "შენიშვნა: სერვერზე ffmpeg არ არის დაყენებული, ამიტომ აუდიო მიწოდდა საწყის კონტეინერში და არა mp3-ში."
  pointer:
    dm: "გაიხსნა ბოტთან შენს პირად მიმოწერაში."
  hint:
    no_url: "ამ წერილში ბმული ვერ ვიპოვე. ჩასვი URL როგორიცაა `https://youtube.com/watch?v=…` და მე მედიას მოვიტან."
  prompt:
    url: "მომაწოდე ბმული, რომლის შენახვაც გსურს. გაუქმება: /stop."
  cancel:
    none: "გაუქმებისთვის აქტიური ჩამოტვირთვები არ გაქვს."
    done: "გაუქმებული ჩამოტვირთვები: {count}."
  status:
    queued: "ვინახავ *{host}* წყაროდან…"
    files: "ამ დრომდე მიწოდებული ფაილები: {count}"
    progress: "მიმდინარეობს ჩამოტვირთვა… {percent}%"
    done: "მზადაა {seconds} წამში · ფაილები: {count} · {size}"
  error:
    not_owner: "ეს ბრძანება ბოტის მფლობელისთვისაა."
    unknown_command: "უცნობი ბრძანება. /help სიას გამოგზავნის."
    invalid_url: "ეს არ ჰგავს სწორ http(s) ბმულს."
    queue_full: "ჩამოტვირთვების რიგი ახლა სავსეა. სცადე ერთ წუთში."
    concurrent: "უკვე {count} ჩამოტვირთვა გაქვს მიმდინარე. დაელოდე მათ ან დააჭირე Stop."
    quota_hour: "საათური ლიმიტი მიღწეულია ({limit} ჩამოტვირთვა). სცადე მოგვიანებით."
    quota_day: "დღიური ლიმიტი მიღწეულია ({limit} ჩამოტვირთვა). ხვალამდე."
    quota_bytes: "დღიური ტრაფიკის ლიმიტი მიღწეულია ({limit}). ხვალამდე."
    source_disabled: "წყარო „{title}“ გამორთულია ამ ბოტზე ადმინისტრატორის მიერ."
    vault_full: "სერვერის დისკის საცავი სავსეა. სცადე მოგვიანებით."
    blocked_type: "ფაილი „{file}“ არის შესრულებადი ტიპი ან სკრიპტი - ასეთებს არ ვაწვდი."
    too_large: "ფაილი ძალიან დიდია ამ პლატფორმისთვის: {size} (ლიმიტი {cap})."
    too_large_link:
      - "ფაილი ძალიან დიდია აქ გამოსაგზავნად: {size} (ლიმიტი {cap})."
      - ""
      - "პირდაპირი ბმული: {url}"
    cat:
      unsupported: "ეს ბმული მხარდაჭერილი არ არის: ვერცერთმა ექსტრაქტორმა ვერ მოახერხა მისი აღება."
      login_required: "ეს შიგთავსი საიტზე ანგარიშს მოითხოვს. ვინახავ მხოლოდ საჯარო გვერდებს."
      age_restricted: "ასაკობრივი შეზღუდვის მქონე შიგთავსი: საიტი მას არ აჩვენებს შესვლის გარეშე."
      private: "ეს შიგთავსი პირადია ან წაშლილია ავტორის მიერ."
      not_found: "გვერდი ან მედია ვერ მოიძებნა (404). შეამოწმე ბმული."
      unavailable: "მედია მიუწვდომელია: ის ავტორმა წაშალა ან დამალა."
      geo_blocked: "ეს შიგთავსი დაბლოკილია სერვერის რეგიონში."
      live_stream: "ეს პირდაპირი ეთერია. ბმული ხელახლა მომაწოდე, როცა გადაცემა დასრულდება."
      rate_limited: "წყარო ახლა ბოტს ზღუდავს. სცადე რამდენიმე წუთში."
      too_large: "ფაილი ლიმიტს აღემატება და უფრო მცირე ფორმატი ხელმისაწვდომი არ არის."
      timeout: "ჩამოტვირთვამ დროის ლიმიტს გადააჭარბა. უზარმაზარი ან ნელი წყარო? სცადე ხელახლა, შეიძლება დაბალი ხარისხით."
      tool_missing: "სერვერზე ამოღების ხელსაწყო არ არის. ეს ადმინისტრატორის საკითხია."
      network: "ქსელის შეცდომა წყაროსთან ურთიერთობისას. სცადე ხელახლა."
      cancelled: "ჩამოტვირთვა გაუქმდა."
      unknown: "ჩამოტვირთვის დროს რაღაც ვერ წავიდა კარგად. სცადე ხელახლა და გამეორების შემთხვევაში უთხარი ადმინისტრატორს."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} / {total}"
