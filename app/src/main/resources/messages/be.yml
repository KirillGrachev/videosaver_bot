# Belarusian messages messages. Flat dotted keys or nested maps - nesting expands into dotted keys.
message:
  start:
    - "*Дашлі мне спасылку, і я прынясу файл.*"
    - ""
    - "YouTube, TikTok, Instagram, Reddit, Pixiv, Vimeo і яшчэ сотня пляцовак: відэа, шортсы, фота, альбомы, GIF-кі, музыка."
    - ""
    - "Проста ўстаў спасылку ў чат. Каманда не патрэбна."
  help:
    command: "*{command}* {description}"
    tip: "І самае простае: проста дашлі мне спасылку."
  about:
    - "*Saver Bot*"
    - ""
    - "Мульціплаформавы спампоўшчык медыя: {sources} крыніц у каталозе плюс любая публічная старонка як запасны варыянт."
    - ""
    - "Версія: {version}"
    - "Паважай аўтарскія правы і правілы пляцовак: захоўвай толькі тое, што табе дазволена захоўваць."
  settings:
    - "*Налады*"
    - ""
    - "Якасць: {quality}"
    - "Мова: {language}"
  quality:
    title: "Абяры якасць спамповак. Яна дзейнічае для ўсіх новых запытаў."
    set: "Якасць: *{quality}*. Новыя спампоўкі будуць ісці ў ёй."
  lang:
    choose: "Абяры сваю мову:"
    set: "Мова пераключана."
  sources:
    title: "*Крыніцы, якія падтрымліваюцца: {count}*"
    legend: "[ok] працуе · [limited] часткова (толькі публічныя спасылкі, часам ламаецца) · [login] патрэбны акаўнт. Любую іншую публічную старонку я паспрабую праз універсальны экстрактар."
    search:
      prompt: "Увядзі частку назвы сайта, напрыклад `tiktok` або `pixiv`. Пустое паведамленне верне спіс."
      empty: "Па запыце «{query}» нічога не знайшлося. Універсальны экстрактар усё адно можа спраўдзіцца: проста дашлі спасылку."
      found: "Знойдзена: {count}. Гартай стрэлкамі або ўдакладні запыт."
  stats:
    - "*Твая статыстыка*"
    - ""
    - "За гадзіну: {jobs_hour} спамповак"
    - "Сёння: {jobs_today} спамповак, {bytes_today}"
  stats.recent: "Апошнія:"
  admin:
    - "*Адмін*"
    - ""
    - "Рухавік: {tools}"
    - "Задачы: {active} актыўных, {queued} у чарзе"
    - "Сховішча: {vault}"
    - "Карыстальнікі: {users}"
  reload:
    done: "Слоўнікі і каталог крыніц перазагружаны ({sources} крыніц)."
  flood: "Занадта шмат паведамленняў запар. Дай мне пару секунд."
  warning:
    audio_raw: "Заўвага: на серверы няма ffmpeg, таму аўдыя дастаўлена ў зыходным кантэйнеры, а не ў mp3."
  pointer:
    dm: "Адкрыта ў асабістых паведамленнях з ботам."
  hint:
    no_url: "Я не знайшоў спасылку ў гэтым паведамленні. Устаў URL выгляду `https://youtube.com/watch?v=…`, і я спампую медыя."
  prompt:
    url: "Дашлі спасылку, якую трэба захаваць. Адмена праз /stop."
  cancel:
    none: "У цябе няма актыўных спамповак для адмены."
    done: "Адменена спамповак: {count}."
  status:
    queued: "Захоўваю з *{host}*…"
    files: "Файлаў дастаўлена: {count}"
    progress: "Спампоўваю… {percent}%"
    done: "Гатова за {seconds} с · файлаў: {count} · {size}"
  error:
    not_owner: "Гэтая каманда толькі для ўладальніка бота."
    unknown_command: "Невядомая каманда. Спіс дашле /help."
    invalid_url: "Гэта не падобна на карэктную http(s) спасылку."
    queue_full: "Чарга спамповак зараз перапоўнена. Паспрабуй праз хвіліну."
    concurrent: "У цябе ўжо {count} спамповак у працы. Дачакайся іх або націсні Stop."
    quota_hour: "Дасягнуты гадзінны ліміт ({limit} спамповак). Паспрабуй пазней."
    quota_day: "Дасягнуты дзённы ліміт ({limit} спамповак). Да заўтра."
    quota_bytes: "Дзённы ліміт трафіку вычарпаны ({limit}). Да заўтра."
    source_disabled: "Крыніца «{title}» адключана на гэтым боце адміністратарам."
    vault_full: "Дыскавае сховішча сервера перапоўнена. Паспрабуй пазней."
    blocked_type: "Файл «{file}» ёсць выканальным тыпам або скрыптом - такія я не дастаўляю."
    too_large: "Файл завялікі для гэтай платформы: {size} (ліміт {cap})."
    too_large_link:
      - "Файл завялікі, каб даслаць яго тут: {size} (ліміт {cap})."
      - ""
      - "Простая спасылка: {url}"
    cat:
      unsupported: "Гэтая спасылка не падтрымліваецца: ніводзін экстрактар не змог яе ўзяць."
      login_required: "Гэты кантэнт патрабуе акаўнт на сайце. Я захоўваю толькі публічныя старонкі."
      age_restricted: "Кантэнт з узроставым абмежаваннем: сайт не паказвае яго без уваходу."
      private: "Гэты кантэнт прыватны або выдалены аўтарам."
      not_found: "Старонка або медыя не знойдзены (404). Правер спасылку."
      unavailable: "Медыя недаступнае: яно выдаленае або схаванае аўтарам."
      geo_blocked: "Гэты кантэнт заблакаваны ў рэгіёне сервера."
      live_stream: "Гэта прамы эфір. Дашлі спасылку зноў, калі трансляцыя скончыцца."
      rate_limited: "Крыніца зараз абмяжоўвае бота. Паўтары праз некалькі хвілін."
      too_large: "Файл большы за ліміт, і меншага фармату крыніца не дае."
      timeout: "Спампоўка перавысіла тайм-аўт. Вялізная або павольная крыніца? Паспрабуй зноў, магчыма, з меншай якасцю."
      tool_missing: "На серверы адсутнічае інструмент вымання. Гэта пытанне да адміністратара."
      network: "Сеткавая памылка пры звароце да крыніцы. Паспрабуй зноў."
      cancelled: "Спампоўка адменена."
      unknown: "Нешта пайшло не так падчас спампоўкі. Паспрабуй яшчэ раз, а пры паўторы расказі адміністратару."
  caption:
    meta: "{source} · {size} · {duration}"
    index: "{index} з {total}"
    truncated: "Толькі першыя {count} элементаў, астатнія на старонцы"

button:
  back: "Назад"
  settings: "Налады"
  sources: "Крыніцы"
  language: "Мова"
  about: "Пра бота"
  help: "Дапамога"
  stats: "Мая статыстыка"
  quality_menu: "Якасць"
  stop: "Стоп"
  search: "Пошук"
  original: "Арыгінал"
  github: "GitHub"
  reload: "Перазагрузіць слоўнікі"
  open_link: "Адкрыць спасылку"
  quality:
    best: "Лепшая"
    "1080": "1080p"
    "720": "720p"
    "480": "480p"
    audio: "Аўдыя (mp3)"
    current_suffix: " (бягучая)"

