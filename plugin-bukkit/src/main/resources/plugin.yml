name: SaverBotLauncher
main: eu.neydev.saver.plugin.bukkit.SaverBotPlugin
version: ${project.version}
api-version: '1.20'
description: Supervises the standalone saver bot as a child process of this server.
author: neydev
commands:
  saverbot:
    description: Control the saver bot child process
    usage: /saverbot status|start|stop|restart
    permission: saverbotlauncher.admin
permissions:
  saverbotlauncher.admin:
    description: Start, stop and inspect the saver bot child process
    default: op
