# =============================================================================
#  Saver Bot — built-in source catalog.
#
#  Each entry routes a host family to the extraction technology that works best
#  for it. The catalog is NOT a whitelist: an unrecognized host falls back to the
#  generic web source (OpenGraph scrape -> yt-dlp generic -> direct file), so any
#  public page with media meta is still attempted.
#
#  Fields:
#    id      — stable lowercase slug (metrics, storage, sources.disabled).
#    title   — human name for /sources.
#    hosts   — suffix patterns; "example.com" also covers "m.example.com".
#    backend — ytdlp | gallerydl | http | direct (tried FIRST; the chain keeps
#              fallbacks, so a video on a gallery site is still extracted).
#    status  — ok | limited | login (shown honestly in /sources).
#    note    — optional one-line caveat.
#
#  An external config/sources.yml merges over this file: the same id overrides,
#  a new id extends. Extraction itself is only as fresh as the installed
#  yt-dlp / gallery-dl — keep the tools updated (Docker image does it on build).
# =============================================================================
